[package]
name = "clocks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A clocks application for the COSMIC desktop"
repository = "https://github.com/th3jk/clocks"

# Both binaries build from the same library, so the daemon shares the config
# schema, page models, audio and i18n with the GUI rather than reimplementing
# them.
[lib]
name = "clocks"
path = "src/lib.rs"

[[bin]]
name = "clocks"
path = "src/main.rs"

# Owns everything time-based. Started on demand through D-Bus activation, and at
# login through an autostart entry, so alarms fire with the GUI closed.
[[bin]]
name = "clocks-daemon"
path = "src/bin/clocks-daemon.rs"

[dependencies]
# Reached directly rather than through `cosmic::cosmic_config`, so the config
# schema does not depend on libcosmic's widget layer. Must stay on the same rev
# as libcosmic below, or the two resolve to different `Config` types.
#
# Deliberately one commit behind master. The next commit, "chore: update iced",
# moves the iced submodule to one whose cctk pin is c0cff4d while libcosmic's
# own stays 32283d7 -- two revisions of cosmic-client-toolkit in one build,
# which Flatpak cannot vendor offline because the generated cargo config maps
# one replacement per repository URL. Here both agree on 32283d7.
cosmic-config = { git = "https://github.com/pop-os/libcosmic.git", rev = "53314201b08b7ff3758b5d1222c4d214abfb5dd8" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
futures-util = "0.3.31"
iana-time-zone = "0.1"
notify-rust = "4"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
serde = { version = "1.0", features = ["derive"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
sunrise = "3"
# Only for libcosmic's calendar widget, which speaks jiff rather than chrono.
# Already in the lockfile via libcosmic, so this pins the same build.
jiff = "0.2"
# Locale fallback for the "System" time format (nl_langinfo). Already in the
# lockfile transitively.
libc = "0.2"
tokio = { version = "1.48.0", features = ["full"] }
# Already in the tree via notify-rust. The daemon uses the blocking API, so it
# needs no async runtime of its own.
zbus = "5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "53314201b08b7ff3758b5d1222c4d214abfb5dd8"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Accessibility support
    "a11y",
    # About widget for the app
    "about",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # Add Wayland support to winit
    "wayland",
    # GPU-accelerated rendering
    "wgpu",
    # XDG portal for file dialogs
    "xdg-portal",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
