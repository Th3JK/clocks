name: Push

on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      # Keep in step with pr.yml: a dependency missing only here means main
      # goes red after a merge that passed its own checks, which is exactly
      # how this broke.
      #
      # libasound2-dev is alsa-sys's build requirement, pulled in by rodio for
      # alarm and timer playback -- without it the build fails in a build script
      # rather than at link time, which makes it look unrelated to audio.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libasound2-dev libudev-dev
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: clippy
        uses: auguwu/clippy-action@1.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
